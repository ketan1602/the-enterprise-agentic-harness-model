[project]
name = "agent-harness-foundations"
version = "1.0.0"
description = "Article 02 — Beyond the Model: Agent Harness Foundations"
requires-python = ">=3.11"
dependencies = [
    "agent-harness-core @ file:../agent-harness-core",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "airefinery-sdk>=1.33.0",
    "truststore>=0.9.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "radon>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agents", "dashboard", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
