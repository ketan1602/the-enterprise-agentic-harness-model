[project]
name = "the-enterprise-agentic-harness-model"
version = "1.0.0"
description = "The Enterprise Agentic Harness Model: ten capabilities, three planes, contracts and conformance (ENG-05)"
requires-python = ">=3.11"
dependencies = [
    "agent-harness-core @ git+ssh://git@github.com/ketan1602/agent-harness-core.git@main",
    "openai>=1.40",
    "truststore>=0.9.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dashboard", "scenario"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["capability(name): which harness capability a conformance test covers"]

[tool.ruff]
line-length = 100
target-version = "py311"
