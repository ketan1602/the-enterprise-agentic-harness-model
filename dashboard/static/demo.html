<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo: the support scenario</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
  <div class="page-header"><h1>The support scenario</h1>
    <p class="text-muted">A live model decides what the support agent does. The same case runs with
    no controls (direct) and through the harness. This makes real model calls and needs
    <code>LLM_API_KEY</code> and <code>LLM_BASE_URL</code> on the server.</p></div>
  <div class="card">
    <form id="form"><div class="form-group"><label for="case">Case</label>
      <select id="case"></select></div>
      <div class="form-group"><label><input type="checkbox" id="noknow" style="width:auto">
        Withhold Knowledge on the harnessed path (the model cannot see the refund policy)</label></div>
      <button type="button" class="btn btn-primary" id="run">Run case</button></form>
    <p class="text-muted" id="task" style="margin-top:10px"></p>
  </div>
  <div id="note"></div>
  <div class="grid-2"><div id="out-direct"></div><div id="out-harnessed"></div></div>
</main>
<script src="/static/app.js"></script>
<script>
const CONTROL = {};
const BADGE = {completed: 'badge-success', blocked: 'badge-error', terminated: 'badge-warning',
               awaiting_approval: 'badge-p3', failed: 'badge-error'};
let cases = [];
function render(title, r) {
  const effects = r.effects.length ? r.effects.map(e => `<div><code>${esc(e.tool)}</code> ${esc(JSON.stringify(e))}</div>`).join('') : '<span class="text-muted">no side effects</span>';
  const verdict = r.violated ? '<span class="badge badge-error">control violated</span>' : '<span class="badge badge-success">no violation</span>';
  const events = (r.events || []).map(e => `<span class="chip">${esc(e)}</span>`).join('');
  const decided = r.decision ? `<p style="margin-top:8px"><strong>Decision:</strong> <code>${esc(r.decision.tool)}</code> ${esc(JSON.stringify(r.decision.arguments))}</p>` : '<p class="text-muted" style="margin-top:8px">The model was never consulted.</p>';
  return `<div class="card"><div class="card-title">${title}</div>
    <p><span class="badge ${BADGE[r.status] || 'badge-neutral'}">${esc(r.status)}</span> ${verdict}</p>
    ${r.reason ? `<p style="margin-top:8px"><strong>Reason:</strong> ${esc(r.reason)}</p>` : ''}${decided}
    ${r.human ? `<p style="margin-top:8px"><strong>Human:</strong> <code>${esc(r.human.approver)}</code> ${r.human.approve ? 'approved' : 'rejected'} the paused run, result <code>${esc(r.human.outcome)}</code></p>` : ''}
    <div style="margin-top:8px"><strong>Side effects</strong><br>${effects}</div>
    ${events ? `<div style="margin-top:8px"><strong>Trace</strong><br>${events}</div>` : ''}</div>`;
}
function showTask() {
  const c = cases.find(x => x.id === el('case').value);
  el('task').textContent = c ? `Customer: ${c.utterance} (expected: ${c.expected})` : '';
}
getJSON('/api/demo/cases').then(list => {
  cases = list;
  list.forEach(c => { CONTROL[c.id] = c.control; });
  const groups = {};
  list.forEach(c => (groups[c.category] ||= []).push(c));
  el('case').innerHTML = Object.entries(groups).map(([cat, items]) =>
    `<optgroup label="${esc(cat)}">${items.map(c => `<option value="${esc(c.id)}">${esc(c.id)}</option>`).join('')}</optgroup>`).join('');
  showTask();
});
el('case').addEventListener('change', showTask);
el('run').addEventListener('click', async () => {
  el('run').disabled = true; el('run').textContent = 'Running (live model)…';
  const r = await postJSON('/api/demo/run', {case_id: el('case').value, knowledge: !el('noknow').checked});
  if (r.detail) {
    el('note').innerHTML = `<div class="alert alert-error">${esc(r.detail)}</div>`;
    el('out-direct').innerHTML = ''; el('out-harnessed').innerHTML = '';
  } else {
    const why = r.paired ? 'The harness judged the same real decision the model made on the direct path.'
      : (CONTROL[r.case] === 'downstream'
        ? 'The direct path produced no decision, so the two paths could not be paired and each asked the model for itself.'
        : 'Each path asked the model for itself, because this control changes what the model sees.');
    el('note').innerHTML = `<div class="alert alert-info">Model: <code>${esc(r.model)}</code>. ${why}</div>`;
    el('out-direct').innerHTML = render('Direct path', r.direct);
    el('out-harnessed').innerHTML = render('Harnessed path', r.harnessed);
  }
  el('run').disabled = false; el('run').textContent = 'Run case';
});
</script>
</body>
</html>
