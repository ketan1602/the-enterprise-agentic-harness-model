<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eval: support cases</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
  <div class="page-header"><h1>Eval: support cases</h1>
    <p class="text-muted">Every case runs on both paths with a live model, so this takes about a
    minute and needs <code>LLM_API_KEY</code> and <code>LLM_BASE_URL</code>. Pass means the harnessed outcome met its
    expectation. Results vary from run to run.</p></div>
  <button class="btn btn-primary" id="run">Run all cases</button>
  <div id="summary" style="margin:16px 0"></div>
  <div id="table"></div>
</main>
<script src="/static/app.js"></script>
<script>
el('run').addEventListener('click', async () => {
  el('run').disabled = true; el('summary').innerHTML = '<p class="loading">Running live model calls…</p>';
  const d = await (await fetch('/api/eval/run', {method: 'POST'})).json();
  el('run').disabled = false;
  if (d.detail) { el('summary').innerHTML = `<div class="alert alert-error">${esc(d.detail)}</div>`; return; }
  const dv = d.rows.filter(r => r.direct_violated).length, hv = d.rows.filter(r => r.harnessed_violated).length;
  el('summary').innerHTML = `<div class="alert alert-success">${esc(d.model)}: ${d.passed}/${d.total} cases met expectation · violations: direct ${dv}, harnessed ${hv}</div>`;
  el('table').innerHTML = `<div class="card"><table><thead><tr><th>Case</th><th>Category</th><th>Expected</th>
    <th>Actual</th><th>Result</th><th>Same decision</th><th>Direct violated</th><th>Harnessed violated</th></tr></thead><tbody>
    ${d.rows.map(r => `<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.category)}</td><td>${esc(r.expected)}</td>
    <td>${esc(r.actual)}</td><td><span class="badge ${r.passed ? 'badge-success' : 'badge-error'}">${r.passed ? 'pass' : 'fail'}</span></td>
    <td>${r.paired ? 'replayed' : 'asked separately'}</td>
    <td>${r.direct_violated ? 'yes' : '—'}</td><td>${r.harnessed_violated ? 'yes' : '—'}</td></tr>`).join('')}
    </tbody></table></div>`;
});
</script>
</body>
</html>
