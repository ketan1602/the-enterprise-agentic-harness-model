<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Enterprise Agentic Harness Model</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
  <div class="page-header">
    <span class="badge badge-p3" id="series" style="margin-bottom:10px"></span>
    <h1 id="title"></h1>
    <p class="text-muted" id="previous"></p>
  </div>
  <div class="alert alert-info" id="claim"></div>
  <h2>The Enterprise Agentic Harness Model</h2>
  <div class="grid-3" id="planes"></div>
  <div class="card"><div class="card-title">Operating loop</div><div class="loop" id="loop"></div></div>
  <div class="card"><div class="card-title">Where the series goes next</div>
    <table><thead><tr><th>Article</th><th>Title</th><th>Deepens</th></tr></thead>
    <tbody id="roadmap"></tbody></table></div>
  <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
    <a href="/demo" class="btn btn-primary">Run a scenario</a>
    <a href="/metrics" class="btn btn-secondary">View measurements</a>
    <a href="/eval" class="btn btn-secondary">Run all cases</a>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
getJSON('/api/overview').then(d => {
  el('series').textContent = `${d.series_id} · ${d.season}`;
  el('title').textContent = d.title;
  el('previous').textContent = `Follows: ${d.previous}`;
  el('claim').textContent = d.central_claim;
  el('planes').innerHTML = d.planes.map(p => `<div class="card"><div class="card-title">${esc(p.name)} plane</div>
    ${p.capabilities.map(c => `<div class="cap"><strong>${c.number}. ${esc(c.name)}</strong>
      <span class="text-muted"> · ${esc(c.phase)}</span>
      ${c.previously_covered ? '<span class="chip">in last week\'s harness (partly)</span>' : ''}</div>`).join('')}
  </div>`).join('');
  el('loop').innerHTML = d.loop.map((s, i) => `<span class="badge badge-p3">${esc(s)}</span>${i < d.loop.length - 1 ? '→' : ''}`).join('');
  el('roadmap').innerHTML = d.roadmap.map(r => `<tr><td>${esc(r.id)}</td><td>${esc(r.title)}</td><td>${esc(r.deepens)}</td></tr>`).join('');
});
</script>
</body>
</html>
